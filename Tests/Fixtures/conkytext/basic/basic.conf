-- ConkyMac test fixture (original work): exercises the conky.text grammar with Menlo so fixed
-- renders do not depend on installed fonts. Run: ConkyMac --render out.png --theme basic.conf
conky.config = {
    font = 'Menlo:size=8',
    default_color = '#c8c8c8',
    color1 = '#4aa3ff',
    color2 = 'orange',
    minimum_width = 260,
    draw_shades = false,
    top_name_width = 12,
}

conky.text = [[
${color1}${font Menlo:size=12:bold}Fixture${font} ${color}theme $alignr${time %H:%M}
${color1}${hr 2}${color}
Colors: ${color red}red ${color #00ff00}green ${color2}orange ${color 808}violet${color} default
${goto 20}goto 20 ${offset 30}offset 30${alignr}right
${alignc}centered line
${tab 60 20}tab${tab 60 20}stops
${voffset 4}cpu ${cpu cpu0}% ${cpubar 5,120}
mem $mem / $memmax ${alignr}${membar 5,80}
${stippled_hr 2}
${color1}Top by CPU ${alignr}memory${color}
${top name 1} ${top cpu 1}% ${alignr}${top_mem name 1}${top_mem mem_res 1}
${top name 2} ${top cpu 2}% ${alignr}${top_mem name 2}${top_mem mem_res 2}
${if_match ${cpu cpu0} > 50}busy${else}idle${endif} | load $loadavg | up $uptime_short
${font Menlo:size=7}$kernel on $machine${font}
not run: [${exec echo pwned}] [${cat /etc/hostname}] [$HOME]
]]
